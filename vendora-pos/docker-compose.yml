version: '3.9'
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    environment:
      MONGO_INITDB_DATABASE: vendora-dev

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["3001:3001"]
    env_file: ./backend/.env
    depends_on: [mongo, redis]
    volumes: ["./backend:/app", "/app/node_modules"]
    command: npm run dev

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    env_file: ./frontend/.env
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: npm run dev

volumes:
  mongo_data:
