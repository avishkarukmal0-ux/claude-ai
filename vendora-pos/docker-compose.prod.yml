version: '3.9'
services:
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: vendora
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always

  backend:
    build:
      context: ./backend
      target: production
    env_file: ./backend/.env.production
    depends_on: [mongo, redis]
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    restart: always

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on: [backend, frontend]
    restart: always

volumes:
  mongo_data:
