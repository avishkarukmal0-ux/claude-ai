# Render Blueprint — STAGING backend (vendora-staging).
#
# WHY THIS FILE EXISTS: the staging service (srv-dbab6hs9v7es73fs029g) failed to build twice because its
# Root Directory was left empty in the dashboard, so Render ran `npm install` at the repo root instead of in
# vendora-pos/backend. Creating the service FROM THIS BLUEPRINT (New > Blueprint) reads `rootDir` from here,
# so the Root Directory is set automatically and never has to be typed by hand again. See Deployment.md.
#
# This is STAGING, not production — load tests and pre-release checks only. Secrets are NOT in this file
# (sync: false): set MONGODB_URI / JWT_SECRET / JWT_REFRESH_SECRET in the Render dashboard after creation.
services:
  - type: web
    name: vendora-staging
    runtime: node
    plan: free
    region: frankfurt
    rootDir: vendora-pos/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NODE_ENV
        value: production
